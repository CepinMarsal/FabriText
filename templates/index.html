<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FabriText - Deteksi Kerusakan Kain</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>FabriText</h1>
            <p>Sistem Deteksi Kondisi Kain Berbasis GLCM & KNN</p>
        </header>
        
        <main>
            <div class="upload-section">
                <div id="drop-zone" class="drop-zone">
                    <div class="icon">
                        <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                            <polyline points="17 8 12 3 7 8"></polyline>
                            <line x1="12" y1="3" x2="12" y2="15"></line>
                        </svg>
                    </div>
                    <p>Seret dan lepas gambar kain ke sini<br>atau <span>Pilih File</span></p>
                    <input type="file" id="file-input" accept="image/*" hidden>
                </div>
                
                <div id="preview-container" class="hidden">
                    <img id="image-preview" src="" alt="Preview">
                    <button id="reset-btn" class="btn btn-secondary">Pilih Gambar Lain</button>
                    <button id="predict-btn" class="btn btn-primary">Deteksi Kerusakan</button>
                </div>
            </div>

            <div id="loading" class="hidden">
                <div class="spinner"></div>
                <p>Menganalisis gambar...</p>
            </div>

            <div id="result-section" class="hidden">
                <h2>Hasil Deteksi</h2>
                <div class="status-badge" id="status-badge"></div>
                <img id="result-image" src="" alt="Result Image">
                <button id="try-again-btn" class="btn btn-primary">Coba Lagi</button>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
