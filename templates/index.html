<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FabriText - Deteksi Kerusakan Kain</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>FabriText</h1>
            <p>Sistem Deteksi Kondisi Kain Berbasis GLCM & KNN</p>
        </header>

        <div class="tabs">
            <button class="tab-btn active" data-target="upload-tab">Unggah Gambar</button>
            <button class="tab-btn" data-target="camera-tab">Kamera Realtime</button>
        </div>
        
        <main>
            <!-- UPLOAD TAB -->
            <div id="upload-tab" class="tab-content active">
                <div class="upload-section">
                    <div id="drop-zone" class="drop-zone">
                        <div class="icon">
                            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                <polyline points="17 8 12 3 7 8"></polyline>
                                <line x1="12" y1="3" x2="12" y2="15"></line>
                            </svg>
                        </div>
                        <p>Seret dan lepas gambar kain ke sini<br>atau <span>Pilih File</span></p>
                        <input type="file" id="file-input" accept="image/*" hidden>
                    </div>
                    
                    <div id="preview-container" class="hidden">
                        <img id="image-preview" src="" alt="Preview">
                        <button id="reset-btn" class="btn btn-secondary">Pilih Gambar Lain</button>
                        <button id="predict-btn" class="btn btn-primary">Deteksi Kerusakan</button>
                    </div>
                </div>

                <div id="loading" class="hidden">
                    <div class="spinner"></div>
                    <p>Menganalisis gambar...</p>
                </div>

                <div id="result-section" class="hidden">
                    <h2>Hasil Deteksi</h2>
                    <div class="status-badge" id="status-badge"></div>
                    <img id="result-image" src="" alt="Result Image">
                    <button id="try-again-btn" class="btn btn-primary">Coba Lagi</button>
                </div>
            </div>

            <!-- CAMERA TAB -->
            <div id="camera-tab" class="tab-content hidden">
                <div class="camera-controls">
                    <div class="select-container">
                        <label for="camera-select">Pilih Kamera:</label>
                        <select id="camera-select" class="form-select"></select>
                    </div>
                    <button id="start-camera-btn" class="btn btn-primary">Mulai Kamera</button>
                    <button id="stop-camera-btn" class="btn btn-danger hidden">Hentikan Kamera</button>
                </div>
                
                <div id="camera-container" class="hidden">
                    <!-- Hidden video element for capturing frames -->
                    <video id="video" autoplay playsinline class="hidden"></video>
                    <!-- Hidden canvas element for reading frames -->
                    <canvas id="canvas" class="hidden"></canvas>
                    
                    <!-- Displayed image element for showing the server-processed feed -->
                    <div class="video-wrapper">
                        <img id="camera-feed" src="" alt="Live Feed">
                        
                        <div class="live-status">
                            <span id="live-status-badge" class="status-badge status-normal">NORMAL</span>
                            <div class="metrics">
                                <span id="conf-metric">Conf: 0.00</span>
                                <span id="edge-metric">Edge: 0.000</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
